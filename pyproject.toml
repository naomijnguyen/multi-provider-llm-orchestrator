[project]
name = "multi-provider-llm-orchestrator"
version = "0.1.0"
description = "A multi-provider reading group and prompt-component experiment runner"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.4",
    "feedparser>=6.0",
    "anthropic>=0.40",
    "openai>=1.50",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "beautifulsoup4>=4.12",
    "python-dotenv>=1.0",
]

[project.scripts]
models-only = "src.main:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]
